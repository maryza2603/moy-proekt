<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Тест заявки в МАХ</title>
<style>
  :root { --bg:#faf6f2; --ink:#2a2523; --muted:#7a6f69; --line:#e5dbd3; --accent:#b8674d; --ok:#2f7d4f; --bad:#b3372c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1b19; --ink:#f1e9e3; --muted:#a79a92; --line:#3a322e; --accent:#d98a6f; --ok:#6fcf97; --bad:#ff8a7e; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:480px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 6px; }
  p.lead { margin:0 0 24px; color:var(--muted); }
  label { display:block; margin:0 0 14px; font-size:.9rem; color:var(--muted); }
  input, textarea { display:block; width:100%; margin-top:6px; padding:12px 14px; font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:10px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  textarea { min-height:110px; resize:vertical; }
  button { width:100%; padding:14px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .hp { position:absolute; left:-9999px; }
  #res { margin-top:20px; display:grid; gap:8px; }
  #res div { padding:10px 14px; border:1px solid var(--line); border-radius:10px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Тест: заявка с сайта</h1>
  <p class="lead">Заполните поля и отправьте. Заявка должна прийти в МАХ и на почту.</p>

  <form id="f" novalidate>
    <label>Имя
      <input name="name" autocomplete="name" required>
    </label>
    <label>Телефон
      <input name="phone" type="tel" autocomplete="tel" required>
    </label>
    <label>Сообщение
      <textarea name="message"></textarea>
    </label>
    <input class="hp" name="site" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button id="b" type="submit">Отправить заявку</button>
  </form>

  <div id="res" aria-live="polite"></div>
</main>

<script>
const MAX_URL = 'https://max-test-form.tg-bot-mindal.workers.dev/';
const MAIL_URL = 'https://formsubmit.co/ajax/maryza2603@gmail.com';

const f = document.getElementById('f');
const res = document.getElementById('res');
const btn = document.getElementById('b');

function show(label, ok, extra) {
  const d = document.createElement('div');
  d.className = ok ? 'ok' : 'bad';
  d.textContent = label + ': ' + (ok ? 'отправлено' : 'ошибка' + (extra ? ' (' + extra + ')' : ''));
  res.appendChild(d);
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  res.textContent = '';
  const data = Object.fromEntries(new FormData(f));
  if (!data.name.trim() || !data.phone.trim()) {
    show('Форма', false, 'заполните имя и телефон');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Отправляю...';

  const toMax = fetch(MAX_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  }).then(r => r.json()).then(j => show('МАХ', j.ok, j.error)).catch(() => show('МАХ', false, 'нет связи'));

  const toMail = fetch(MAIL_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ name: data.name, phone: data.phone, message: data.message, _subject: 'Заявка с тестовой страницы', _captcha: 'false' }),
  }).then(r => r.json()).then(j => show('Почта', String(j.success) === 'true', j.message)).catch(() => show('Почта', false, 'нет связи'));

  await Promise.all([toMax, toMail]);
  btn.disabled = false;
  btn.textContent = 'Отправить заявку';
});
</script>
</body>
</html>
